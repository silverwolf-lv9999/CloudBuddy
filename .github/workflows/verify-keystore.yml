name: verify-keystore

# 临时校验：确认 Python 生成的 JKS 能被 JDK / apksigner 正常读取，
# 并用它完整构建一次 release 包。验证通过后删除此 workflow。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/**', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 准备 Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk/platforms/android-35" ]; then
            echo "::error::runner 上 SDK 不完整"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      - name: 校验密钥库可读
        env:
          KEYSTORE_B64: ${{ secrets.CLOUDBUDDY_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CLOUDBUDDY_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/cloudbuddy-release.jks
          echo "== keytool -list =="
          keytool -list -v -keystore keystore/cloudbuddy-release.jks \
            -storepass "$KS_PASS" -alias cloudbuddy | grep -E "Alias|Entry type|Subject|Valid|SHA256" || true
          keytool -list -keystore keystore/cloudbuddy-release.jks -storepass "$KS_PASS" -alias cloudbuddy >/dev/null
          echo "keytool 读取成功"

      - name: 写 local.properties
        env:
          KS_PASS: ${{ secrets.CLOUDBUDDY_KEYSTORE_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "release.storeFile=keystore/cloudbuddy-release.jks"
            echo "release.storePassword=$KS_PASS"
            echo "release.keyAlias=cloudbuddy"
            echo "release.keyPassword=$KS_PASS"
          } > local.properties

      - name: 构建并自检
        run: |
          set +e
          bash scripts/verify.sh 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e
          tail -40 /tmp/build.log || true
          if [ "$status" -ne 0 ]; then
            msg=$(tail -30 /tmp/build.log | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-6000)
            echo "::error title=verify.sh 失败(exit $status)::$msg"
            exit "$status"
          fi

      # 三个包各自一个 artifact：下载时只取需要的那个，不用把整包 zip 全下来。
      # 先按发行版归集到独立目录，避免 glob 互相匹配（完整版文件名里没有 edition 段）。
      - name: 归集产物
        run: |
          mkdir -p out/base out/full out/plus
          cp dist/CloudBuddy-*-base-release.apk out/base/
          cp dist/CloudBuddy-*-plus-release.apk out/plus/
          # 完整版没有 edition 段：复制 base/plus 之外的剩余 release apk
          for f in dist/CloudBuddy-*-release.apk; do
            case "$f" in
              *-base-release.apk|*-plus-release.apk) ;;
              *) cp "$f" out/full/ ;;
            esac
          done
          ls -l out/base out/full out/plus

      - name: 上传基础版
        uses: actions/upload-artifact@v4
        with:
          name: CloudBuddy-base
          path: out/base/*.apk
          if-no-files-found: error

      - name: 上传完整版
        uses: actions/upload-artifact@v4
        with:
          name: CloudBuddy-full
          path: out/full/*.apk
          if-no-files-found: error

      - name: 上传共存版
        uses: actions/upload-artifact@v4
        with:
          name: CloudBuddy-plus
          path: out/plus/*.apk
          if-no-files-found: error


