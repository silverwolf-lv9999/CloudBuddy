name: gen-keystore

# 一次性任务：用 JDK 自带 keytool 生成正式签名密钥库并上传为 artifact。
# 生成后下载、写入 Secrets，随即删除本 workflow 与运行记录。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 生成密钥库
        run: |
          PASS=$(openssl rand -base64 36 | tr -d '\n=+/' | cut -c1-32)
          mkdir -p out
          keytool -genkeypair \
            -keystore out/cloudbuddy-release.jks \
            -storetype JKS \
            -alias cloudbuddy \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=CloudBuddy, O=CloudBuddy, L=Shanghai, ST=Shanghai, C=CN" \
            -storepass "$PASS" \
            -keypass "$PASS"

          # 强制解密私钥做一次自检：importkeystore 会真正读取私钥
          rm -f out/copy.p12
          keytool -importkeystore \
            -srckeystore out/cloudbuddy-release.jks -srcstoretype JKS \
            -srcstorepass "$PASS" -srcalias cloudbuddy -srckeypass "$PASS" \
            -destkeystore out/copy.p12 -deststoretype PKCS12 \
            -deststorepass "$PASS" -destalias cloudbuddy
          rm -f out/copy.p12

          keytool -list -v -keystore out/cloudbuddy-release.jks -storepass "$PASS" \
            | grep -E "Alias name|Owner|Valid from|SHA256:" || true

          printf '%s' "$PASS" > out/password.txt
          ls -l out

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: cloudbuddy-keystore
          path: out/
