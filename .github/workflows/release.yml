name: release

# 打 tag 自动出正式包并发 Release；也可以手动触发，只构建不发版。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # tag 和 build.gradle.kts 的版本号必须一致，否则会出现「Release 标的 v1.2.0，
      # 装上去显示 1.1.0」，用户没法判断自己装的是哪个。
      - name: 校验 tag 与 versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=$tag versionName=$ver versionCode=$code"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $tag 与 build.gradle.kts 的 versionName $ver 不一致"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：runner 镜像本来就带 SDK，那个 action
      # 会连 dl.google.com 下 cmdline-tools 再 sdkmanager --update，网络一抖整步就失败。
      - name: 准备 Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "候选 SDK: $sdk"
          if [ ! -d "$sdk" ]; then
            echo "::error::runner 上没有 $sdk，镜像可能变了"
            ls /usr/local/lib 2>/dev/null || true
            exit 1
          fi
          echo "== platforms =="; ls "$sdk/platforms" 2>/dev/null || true
          echo "== build-tools =="; ls "$sdk/build-tools" 2>/dev/null || true
          if [ ! -d "$sdk/platforms/android-35" ] || [ -z "$(ls -A "$sdk/build-tools" 2>/dev/null)" ]; then
            echo "::error::缺少 platforms/android-35 或 build-tools，SDK 不完整"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      # 密钥以 base64 存在 Secrets 里，只在 runner 上还原成文件，跑完随机器销毁。
      # 不要把它写进仓库、artifact 或日志。
      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，正式包无法签名"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/cloudbuddy-release.jks
          # 先确认解出来的密钥真能打开，别等到 apksigner 那步才报错
          keytool -list -keystore keystore/cloudbuddy-release.jks -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "release.storeFile=keystore/cloudbuddy-release.jks"
            echo "release.storePassword=$KS_PASS"
            echo "release.keyAlias=$KEY_ALIAS"
            echo "release.keyPassword=$KEY_PASS"
          } > local.properties

      # 失败时把末尾几十行塞进 ::error:: 注解。Actions 的原始日志要从 blob 存储下载，
      # 有些出口网关取不到；注解走普通 API，能读。
      - name: 构建与自检
        run: |
          set +e
          bash scripts/verify.sh 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          set -e
          tail -25 /tmp/build.log || true
          if [ "$status" -ne 0 ]; then
            msg=$(tail -30 /tmp/build.log | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-6000)
            echo "::error title=verify.sh 失败(exit $status)::$msg"
            exit "$status"
          fi

      # 三个包各自一个 artifact：下载时只取需要的那个，不用把整包 zip 全下来。
      - name: 归集产物
        run: |
          mkdir -p out/base out/full out/plus
          cp dist/CloudBuddy-*-base-release.apk out/base/
          cp dist/CloudBuddy-*-plus-release.apk out/plus/
          for f in dist/CloudBuddy-*-release.apk; do
            case "$f" in
              *-base-release.apk|*-plus-release.apk) ;;
              *) cp "$f" out/full/ ;;
            esac
          done

      - name: 留存基础版
        uses: actions/upload-artifact@v4
        with:
          name: CloudBuddy-base
          path: out/base/*.apk

      - name: 留存完整版
        uses: actions/upload-artifact@v4
        with:
          name: CloudBuddy-full
          path: out/full/*.apk

      - name: 留存共存版
        uses: actions/upload-artifact@v4
        with:
          name: CloudBuddy-plus
          path: out/plus/*.apk

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 三个包一起发：基础版、完整版（与基础版同包名，互相覆盖）、共存版（包名带 .plus）。
          # 缺任何一个都会让人以为"这个版本没有我要的那个档位"。
          ls -l dist/
          full_apk=$(ls dist/CloudBuddy-*-release.apk | grep -v -e '-base-release' -e '-plus-release' | head -1)
          base_apk=$(ls dist/CloudBuddy-*-base-release.apk | head -1)
          plus_apk=$(ls dist/CloudBuddy-*-plus-release.apk | head -1)
          test -f "$full_apk" || { echo "::error::没有找到完整版安装包"; exit 1; }
          test -f "$base_apk" || { echo "::error::没有找到基础版安装包"; exit 1; }
          test -f "$plus_apk" || { echo "::error::没有找到共存版安装包"; exit 1; }
          full_sha=$(sha256sum "$full_apk" | cut -d' ' -f1)
          base_sha=$(sha256sum "$base_apk" | cut -d' ' -f1)
          plus_sha=$(sha256sum "$plus_apk" | cut -d' ' -f1)
          {
            echo "## CloudBuddy ${GITHUB_REF_NAME#v}"
            echo
            echo "版本号与 tag 一致，使用正式密钥签名。同一份代码三个包，按需要选一个："
            echo
            echo "| 包 | 包名 | 包含 | sha256 |"
            echo "|---|---|---|---|"
            echo "| 基础版 | \`cn.cloudbuddy.app\` | 只有云端模型；不含本机 agent、第三方 API、终端 | \`$base_sha\` |"
            echo "| 完整版 | \`cn.cloudbuddy.app\` | 云端模型 + 本机 agent（Koog）+ 第三方 OpenAI 兼容 API + 终端命令行 | \`$full_sha\` |"
            echo "| 共存版 | \`cn.cloudbuddy.app.plus\` | 内容同完整版；包名不同，可与上面两个同时安装 | \`$plus_sha\` |"
            echo
            echo "**基础版与完整版包名相同**，装完整版就是覆盖升级，登录态与设置原样保留；"
            echo "想退回基础版再装一次即可，同样不丢数据——这两个是同一个应用的两个档位。"
            echo
            echo "**共存版包名不同**，可以同时安装（桌面上会并排出现两个同名图标，"
            echo "卸载或升级时按「应用信息」里的包名区分）。三个包版本号一致，各升各的。"
          } > /tmp/notes.md
          # 已存在同名 Release 时补传资产，不重建——重建会丢已写的说明。
          gh release create "$GITHUB_REF_NAME" \
            --title "CloudBuddy ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/notes.md "$full_apk" "$base_apk" "$plus_apk" \
            || gh release upload "$GITHUB_REF_NAME" "$full_apk" "$base_apk" "$plus_apk" --clobber
