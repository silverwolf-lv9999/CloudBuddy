org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dsun.net.client.defaultConnectTimeout=10000 -Dsun.net.client.defaultReadTimeout=25000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
# R8 full mode：更激进的分析与裁剪，AGP 8 默认值，这里显式声明以便离线环境下也确定生效
android.enableR8.fullMode=true
# 非传递 R 类之外，再开资源名字混淆（配合 isShrinkResources）
android.nonFinalResIds=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
